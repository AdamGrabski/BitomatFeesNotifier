name: Bitomat Monitor

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest -v

      - name: Run Bitomat monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMISSION_THRESHOLD_PERCENT: ${{ secrets.COMMISSION_THRESHOLD_PERCENT }}
        run: python bitomat_usdt_monitor.py

      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alert_state.json
          if git diff --cached --quiet; then
            echo "No alert state changes to commit."
          else
            git commit -m "Update Bitomat alert state"
            git push
          fi
