name: Bitomat Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Run immediately and ignore the Poland-time schedule window"
        required: false
        default: false
        type: boolean

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Bitomat monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMISSION_THRESHOLD_PERCENT: ${{ secrets.COMMISSION_THRESHOLD_PERCENT }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: python bitomat_usdt_monitor.py
